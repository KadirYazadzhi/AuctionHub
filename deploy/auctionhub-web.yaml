apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionhub-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auctionhub-web
  template:
    metadata:
      labels:
        app: auctionhub-web
    spec:
      # InitContainer waits for the database to open port 1433
      initContainers:
      - name: wait-for-mssql
        image: busybox:1.28
        command: ['sh', '-c', "until nc -zv mssql-svc 1433; do echo waiting for mssql; sleep 2; done;"]
      containers:
      - name: auctionhub-web
        image: <YOUR_REGISTRY_IP>:<PORT>/auctionhub-web:<VERSION>
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        
        # Individual database settings (Critical for Program.cs)
        - name: DB_SERVER
          value: "mssql-svc"
        - name: DB_NAME
          value: "AuctionHubDb"
        - name: DB_USER
          value: "auction_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auctionhub-secrets
              key: DB_PASSWORD
        
        # Full Connection String (for compatibility)
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: auctionhub-secrets
              key: ConnectionStrings__DefaultConnection

        # Redis settings
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: auctionhub-secrets
              key: redis-connection
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              name: auctionhub-secrets
              key: ConnectionStrings__Redis

        # Cloudinary
        - name: Cloudinary__CloudName
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: cloudinary-cloudname }
        - name: Cloudinary__ApiKey
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: cloudinary-apikey }
        - name: Cloudinary__ApiSecret
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: cloudinary-apisecret }

        # Authentication (Google & GitHub)
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: google-clientid }
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: google-clientsecret }
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: github-clientid }
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: github-clientsecret }

        # AI
        - name: AI__HuggingFaceToken
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: AI__HuggingFaceToken }
        - name: AI__ModerationServiceUrl
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: AI__ModerationServiceUrl }
        
        # Email Settings
        - name: EmailSettings__ApiToken
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: email-apitoken } }
        - name: EmailSettings__Password
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: EmailSettings__Password } }
        - name: EmailSettings__Host
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: EmailSettings__Host } }
        - name: EmailSettings__Port
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: EmailSettings__Port } }
        - name: EmailSettings__Username
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: EmailSettings__Username } }

        # Google reCAPTCHA
        - name: GoogleReCaptcha__SiteKey
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: GoogleReCaptcha__SiteKey }
        - name: GoogleReCaptcha__SecretKey
          valueFrom:
            secretKeyRef: { name: auctionhub-secrets, key: GoogleReCaptcha__SecretKey }

        # Admin Account Seeding
        - name: ADMIN_EMAIL
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: ADMIN_EMAIL } }
        - name: ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: ADMIN_PASSWORD } }
        - name: ADMIN_FIRST_NAME
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: ADMIN_FIRST_NAME } }
        - name: ADMIN_LAST_NAME
          valueFrom: { secretKeyRef: { name: auctionhub-secrets, key: ADMIN_LAST_NAME } }
---
apiVersion: v1
kind: Service
metadata:
  name: auctionhub-web-service
spec:
  selector:
    app: auctionhub-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auctionhub-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "AF_STICKY"
    # HTTPOnly and Secure (MANDATORY for HTTPS)
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    # SameSite setting for WSS requests compatibility
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "none"
    cert-manager.io/cluster-issuer: <YOUR_CLUSTER_ISSUER>
spec:
  rules:
  - host: <YOUR_DOMAIN>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auctionhub-web-service
            port:
              number: 80
  tls:
  - hosts:
    - <YOUR_DOMAIN>
    secretName: auction-tls-cert
