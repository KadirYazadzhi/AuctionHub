version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auctionhub-db
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ActionHub2026!
    ports:
      - "5899:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: auctionhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  mssql-data:
  redis-data:
